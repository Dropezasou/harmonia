name: Coleta de cafés especiais

on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/scrape/coffee-*', 'scripts/scrape/flavor-map-*.json', '.github/workflows/coffee.yml']

permissions:
  contents: write

jobs:
  cafes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: coleta
        run: |
          LIMIT=$(cat scripts/scrape/coffee-limit.txt 2>/dev/null || echo 10)
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"
          node scripts/scrape/coffee-scrape.mjs --limit "$LIMIT" --out cafes.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Salvar base completa na branch
        if: steps.coleta.outputs.limit > 10
        run: |
          mkdir -p data && cp cafes.json data/coffee-raw.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coffee-raw.json
          git diff --cached --quiet || (git commit -m "Base coletada de cafés especiais" && git push)
