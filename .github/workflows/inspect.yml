name: Inspecionar sites escolhidos

on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/scrape/inspect-sites.mjs', '.github/workflows/inspect.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/scrape/inspect-sites.mjs
